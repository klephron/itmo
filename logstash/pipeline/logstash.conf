input {
  tcp {
    type => "tcp_events"
    port => 5000
    codec => json_lines
  }
#  file {
#    type => "mongodb_logs"
#    path => "/var/log/mongodb/mongod.log"
#    start_position => "beginning"
#    sincedb_path => "/usr/share/logstash/pipeline/.sincedb_mongodb"
#  }
  beats {
    port => 5044
  }
}

filter {
  if [type] == "tcp_events" {
    mutate {
      add_field => { "environment" => "dev" }
    }
  }
  if "mongodb" in [container][name] {
      grok {
        match => { "message" => "\A%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:severity} %{GREEDYDATA:message_text}" }
      }

      date {
        match => ["timestamp", "ISO8601"]
      }

      mutate {
        add_field => { "source" => "mongodb" }
      }
    }
#  if [type] == "mongodb_logs" {
#    json {
#      source => "message"
#      target => "parsed_message"
#    }
#
#    mutate {
#      rename => { "[parsed_message][t][$date]" => "timestamp" }
#      rename => { "[parsed_message][s]" => "severity" }
#      rename => { "[parsed_message][c]" => "component" }
#      rename => { "[parsed_message][id]" => "event_id" }
#      rename => { "[parsed_message][ctx]" => "context" }
#      rename => { "[parsed_message][msg]" => "message_text" }
#    }
#
#    mutate {
#      remove_field => ["parsed_message"]
#    }
#
#    date {
#      match => [ "timestamp", "ISO8601" ]
#    }
#  }
}

output {
  if [type] == "tcp_events" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "java-logs-%{+YYYY.MM.dd}"
    }
  }
#  if [type] == "mongodb_logs" {
#    elasticsearch {
#      hosts => ["http://elasticsearch:9200"]
#      index => "mongodb-logs-%{+YYYY.MM.dd}"
#    }
  if [source] == "mongodb" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "mongodb-logs-%{+YYYY.MM.dd}"
    }
  }
