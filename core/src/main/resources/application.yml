server:
  port: 8081

spring:
  application:
    name: video-streaming-demo

  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 10000MB

  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # ??? ? ??????
    show-sql: false
    database: POSTGRESQL

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

streaming:
  chunk:
    default-size: 2621440  # 2.5 MB

minio:
  url: http://localhost:9000
  username: minio_admin
  password: minio_admin
  bucket:
    video: videos
    thumb: thumbs
    avatar: avatars
  stream:
    part-size: 5242880     # 5 MB

transcoder:
  ffmpeg-path: "C:/ffmpeg/bin/ffmpeg.exe"
  ffprobe-path: "C:/ffmpeg/bin/ffprobe.exe"

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
    expiration-ms: 3600000
  likes:
    exchange: video.likes
  views:
    exchange: video.views
