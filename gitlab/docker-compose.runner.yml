services:
  runner-1:
    build: runner
    container_name: "brainstop-runner-1"
    runtime: sysbox-runc
    restart: unless-stopped
    volumes:
      - runner-1-etc:/etc/gitlab-runner
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "4000MiB"

volumes:
  runner-1-etc:
