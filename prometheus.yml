global:
  scrape_interval: 15s
  external_labels:
    monitor: 'emqx-monitor'

scrape_configs:
  # EMQX
  - job_name: 'emqx_stats'
    static_configs:
      - targets: ['mqtt-broker:18083']
    metrics_path: '/api/v5/prometheus/stats'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  - job_name: 'emqx_auth'
    static_configs:
      - targets: [ 'mqtt-broker:18083' ]
    metrics_path: '/api/v5/prometheus/auth'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  - job_name: 'emqx_data_integration'
    static_configs:
      - targets: [ 'mqtt-broker:18083' ]
    metrics_path: '/api/v5/prometheus/data_integration'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  # MongoDB
  - job_name: 'mongodb'
    metrics_path: /metrics
    scheme: http
    static_configs:
    - targets: ['mongodb-exporter:9216']

  # RabbitMQ
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  # Java Application (Micrometer or JMX Exporter)
  - job_name: 'metrics-service'
    scrape_interval: 15s
    static_configs:
      - targets: ['metrics-service:8080']  # Замените порт на порт вашего JMX Exporter или Micrometer
