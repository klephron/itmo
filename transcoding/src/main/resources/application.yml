server:
  port: 8088

spring:
  application:
    name: transcoding-service
  profiles:
    default: dev
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

springdoc:
  swagger-ui:
    display-request-duration: true
    urls-primary-name: transcoding-service

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
