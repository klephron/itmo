server:
  port: ${PORT:0}

spring:
  application:
    name: transcoding-service
  profiles:
    default: dev
#  cloud:
#    loadbalancer:
#      configurations: round_robin
#      cache:
#        enabled: true
#        ttl: 2s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.uuid}

springdoc:
  swagger-ui:
    display-request-duration: true
    urls-primary-name: transcoding-service

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
