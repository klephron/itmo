server:
  port: 8085

spring:
  application:
    name: admin-service
  profiles:
    default: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

springdoc:
  swagger-ui:
    display-request-duration: true
    urls-primary-name: admin-service

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
