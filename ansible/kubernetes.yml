---
- hosts: all
  become: true
  pre_tasks:
    - name: Fail if not Ubuntu
      fail:
        msg: "This playbook only supports Ubuntu."
      when: ansible_distribution not in ["Ubuntu"]

- hosts: kubernetes
  tasks:
    - import_role:
        name: ubuntu
        tasks_from: ip_forward.yml

    - import_role:
        name: ubuntu
        tasks_from: ssh.yml

    - import_role:
        name: ubuntu
        tasks_from: swap.yml

- hosts: kubernetes
  roles:
    - kubernetes
