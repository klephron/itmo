---
- hosts: nodes

  vars:
    project_src: "{{ ('/root' if ansible_user == 'root' else '/home/' + ansible_user) }}"
    project_compose_file: "{{ project_src }}/docker-compose.yml"

  tasks:
    - name: Ensure project directory exists
      file:
        path: "{{ project_src }}"
        state: directory
        mode: "0755"

    - name: Deploy docker-compose.yml using jinja2
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ project_compose_file }}"
        mode: "0644"

    - name: Reload docker-compose
      shell: "docker compose -f {{ project_compose_file }} up -d --remove-orphans"
      args:
        chdir: "{{ project_src }}"
      register: project_compose_result

    - name: Debug docker-compose result
      debug: msg="{{ project_compose_result.stderr_lines }}"
