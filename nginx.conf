worker_processes  1;
pid /home/studs/s312563/works/mpi/frontend/nginx.pid;
error_log /home/studs/s312563/works/mpi/frontend/error.log;

events {
  worker_connections  1024;
}

http {
  include /home/studs/s312563/works/mpi/frontend/mime.types;

  access_log /home/studs/s312563/works/mpi/frontend/access.log;
  client_body_temp_path /home/studs/s312563/works/mpi/frontend/temp/client_body_temp;
  fastcgi_temp_path /home/studs/s312563/works/mpi/frontend/temp/fastcgi_temp;
  proxy_temp_path /home/studs/s312563/works/mpi/frontend/temp/proxy_temp;
  scgi_temp_path /home/studs/s312563/works/mpi/frontend/temp/scgi_temp;
  uwsgi_temp_path /home/studs/s312563/works/mpi/frontend/temp/uwsgi_temp;

  server {
    listen 7621;
    server_name _;
    root /home/studs/s312563/works/mpi/frontend/html;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
