global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "discovery-eureka"
    metrics_path: /actuator/prometheus

    eureka_sd_configs:
      - server: http://discovery:8761/eureka

    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application

      - target_label: namespace
        replacement: PRODUCTION

  - job_name: "eureka"
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - discovery:8761

    relabel_configs:
      - target_label: application
        replacement: DISCOVERY

      - target_label: namespace
        replacement: PRODUCTION

  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets:
          - cadvisor:8080
