server:
  port: ${PORT:0}

spring:
  application:
    name: search-service
  profiles:
    default: dev
#  cloud:
#    loadbalancer:
#      configurations: round_robin
#      cache:
#        enabled: true
#        ttl: 2s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.uuid}

springdoc:
  swagger-ui:
    display-request-duration: true
    urls-primary-name: search-service

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"

llm:
  openrouter:
    enabled: true
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    models:
      - mistralai/mistral-7b-instruct:free
      - qwen/qwen2.5-7b-instruct:free
    timeout: 8s
    temperature: 0.2
    top-p: 0.9
    max-tokens: 256
    stream-log: false
    referer: ${OPENROUTER_REFERER:}
    title: ${OPENROUTER_TITLE:brainstop-search}
  search:
    enabled: true
    rewrite-enabled: false
    expansion-enabled: true
    expansion-count: 10
    min-query-length: 3
    pool-multiplier: 2
    max-pool-size: 60
    suggest-multiplier: 2
    rewrite-max-tokens: 80
    expansion-max-tokens: 256
    filter-enabled: true
    filter-max-tokens: 120
    filter-max-items: 0
    filter-max-chars: 2000
    filter-max-field-length: 140
    cache-ttl: 30m
    rag-enabled: false
    rag-max-items: 20
    rag-max-chars: 2000
    rag-max-field-length: 140

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    io.github.resilience4j.circuitbreaker: INFO
    ru.itmo.zavar.brainstop.search.llm: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - feign.FeignException$NotFound
    instances:
      default:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true
    instances:
      default:
        baseConfig: default
