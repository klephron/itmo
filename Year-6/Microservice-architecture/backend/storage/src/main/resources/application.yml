server:
  port: ${PORT:0}

spring:
  application:
    name: storage-service
  profiles:
    default: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.uuid}

minio:
  url: http://localhost:9000
  username: minio_admin
  password: minio_admin
  bucket:
    video: videos
    thumb: thumbs
    avatar: avatars
  stream:
    part-size: 5242880

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
