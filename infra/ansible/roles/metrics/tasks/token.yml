---
- name: Ensure metrics directory exists
  ansible.builtin.file:
    path: "{{ metrics_src }}"
    state: directory
    mode: "0755"
  tags:
    - deploy
    - token

- name: Copy kubernetes bearer token
  ansible.builtin.copy:
    content: "{{ hostvars['devops-control-1']['kubernetes_prometheus_token'] }}"
    dest: "{{ metrics_kubernetes_bearer_token_file }}"
    mode: "0644"
  tags:
    - deploy
    - token
