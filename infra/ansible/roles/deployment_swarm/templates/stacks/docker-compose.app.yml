services:
  mqtt-broker:
    image: emqx/emqx:latest
    environment:
      - EMQX_MQTT__MAX_MQUEUE_LEN=1000
      - EMQX_MQTT__MESSAGE_EXPIRY_INTERVAL=3600
    ports:
      - "{{ mqtt_broker_dashboard_port }}:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
    networks:
      - ahla-net

  rabbitmq:
    image: rabbitmq:3.11-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "{{ rabbitmq_dashboard_port }}:15672"
    depends_on:
      - mqtt-broker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "node_health_check", "-q"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
    networks:
      - ahla-net

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    networks:
      - ahla-net

  iot-controller:
    image: "{{ iot_controller_image }}"
    environment:
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_TOPIC: $$share/myGroup/radiator/data
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASS: guest
      RABBIT_QUEUE_NAME: testQueue
      MONGO_URI: mongodb://zavar:zavar@mongodb:27017/
      MONGO_DB_NAME: iot-db
      MONGO_DB_COLLECTION: radiator
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      - rabbitmq
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    networks:
      - ahla-net

  rule-engine:
    image: "{{ rule_engine_image }}"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASS: guest
      RABBIT_QUEUE_NAME: testQueue
      MONGO_URI: mongodb://zavar:zavar@mongodb:27017/
      MONGO_DB_NAME: iot-db
      MONGO_DB_COLLECTION: rules
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
    networks:
      - ahla-net

  account:
    image: "{{ account_image }}"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://zavar:zavar@mongodb:27017/iot-db
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      MQTT_URI: tcp://mqtt-broker:1883
      MQTT_TOPIC: radiator/reset
      MQTT_CLIENT_ID: account
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -f http://localhost:8082/actuator/health | grep ''{"status":"UP"}'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      replicas: {{ account_replicas }}
      placement:
        constraints:
          - node.role == worker
    networks:
      - ahla-net

networks:
  ahla-net:
    external: true

volumes:
  redis-data:
