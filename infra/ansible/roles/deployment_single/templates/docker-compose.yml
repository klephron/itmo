services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - "{{ deployment_single_src }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "{{ deployment_single_src }}/prometheus/rules.yml:/etc/prometheus/rules.yml"
      - prometheus-data:/prometheus
    ports:
      - "{{ prometheus_port }}:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "{{ grafana_port }}:3000"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data/

  logstash:
    image: "{{ logstash_image }}"
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - "{{ deployment_single_src }}/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.2
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "{{ kibana_port }}:5601"
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://kibana:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mqtt-broker:
    image: emqx/emqx:latest
    environment:
      - EMQX_MQTT__MAX_MQUEUE_LEN=1000
      - EMQX_MQTT__MESSAGE_EXPIRY_INTERVAL=3600
    ports:
      - "{{ mqtt_broker_dashboard_port }}:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.11-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "{{ rabbitmq_dashboard_port }}:15672"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "node_health_check", "-q"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb-data:/data/db
      - "{{ deployment_single_src }}//mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro"
    command: mongod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    environment:
      MONGODB_URI: "mongodb://root:root@mongodb:27017/admin"
    command: ["--collect-all", "--compatible-mode", "--discovering-mode"]
    depends_on:
      mongodb:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: root
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongodb:27017/
    ports:
      - "{{ mongo_express_port }}:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - "{{ deployment_single_src }}/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
    depends_on:
      - logstash

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  iot-controller:
    image: "{{ iot_controller_image }}"
    environment:
      MQTT_BROKER_URL: tcp://mqtt-broker:1883
      MQTT_TOPIC: $$share/myGroup/radiator/data
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASS: guest
      RABBIT_QUEUE_NAME: testQueue
      MONGO_URI: mongodb://zavar:zavar@mongodb:27017/
      MONGO_DB_NAME: iot-db
      MONGO_DB_COLLECTION: radiator
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy

  rule-engine:
    image: "{{ rule_engine_image }}"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASS: guest
      RABBIT_QUEUE_NAME: testQueue
      MONGO_URI: mongodb://zavar:zavar@mongodb:27017/
      MONGO_DB_NAME: iot-db
      MONGO_DB_COLLECTION: rules
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      iot-controller:
        condition: service_started
      consul:
        condition: service_healthy

  account:
    image: "{{ account_image }}"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://zavar:zavar@mongodb:27017/iot-db
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      MQTT_URI: tcp://mqtt-broker:1883
      MQTT_TOPIC: radiator/reset
      MQTT_CLIENT_ID: account
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "{{ account_port }}:8082"
    depends_on:
      kibana:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      consul:
        condition: service_healthy

  consul:
    image: "{{ consul_image }}"
    environment:
      CONSUL_BOOTSTRAP_EXPECT: 1
      CONSUL_CLIENT_LAN_ADDRESS: 0.0.0.0
      CONSUL_DISABLE_KEYRING_FILE: true
    volumes:
      - consul-data:/bitnami
    ports:
      - "{{ consul_port }}:8500"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/v1/status/leader  || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  mongodb-data:
  redis-data:
  consul-data:
