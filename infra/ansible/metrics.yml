---
- hosts: metrics
  become: true
  pre_tasks:
    - name: Fail if not Ubuntu
      ansible.builtin.fail:
        msg: "This playbook only supports Ubuntu."
      when: ansible_distribution not in ["Ubuntu"]

- hosts: control
  tasks:
    - import_role:
        name: control
        tasks_from: token.yml

- hosts: metrics
  roles:
    - docker
    - metrics
