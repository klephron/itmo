prometheus_port: 8113
grafana_port: 8114

kubernetes_api_server_host: "{{ hostvars['devops-control-1'].ansible_host }}"
kubernetes_api_server_port: 6443

kubernetes_namespace: "devops"

metrics_src: "{{ '/root' if ansible_user == 'root' else '/home/' + ansible_user }}/metrics"
metrics_compose_file: "{{ metrics_src }}/docker-compose.metrics.yml"
metrics_prometheus_file: "{{ metrics_src }}/prometheus.yml"
metrics_kubernetes_bearer_token_file: "{{ metrics_src }}/kubernetes-bearer-token.txt"
