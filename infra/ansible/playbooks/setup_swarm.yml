---
- hosts: swarm
  become: true
  pre_tasks:
    - name: Fail if not Ubuntu
      ansible.builtin.fail:
        msg: "This playbook only supports Ubuntu."
      when: ansible_distribution not in ["Ubuntu"]

- hosts: swarm
  roles:
    - docker

- hosts: manager
  roles:
    - swarm_manager

- hosts: worker
  roles:
    - swarm_worker
