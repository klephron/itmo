groups:
  - name: system-alerts
    rules:
      - alert: HighCpuUsage
        expr: rate(process_cpu_seconds_total[1m]) > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU"
          description: "CPU загружен более чем на 80%."

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / process_virtual_memory_bytes) > 0.75
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование памяти"
          description: "ОЗУ используется более чем на 75%."

      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Сервис недоступен"
          description: "Сервис недоступен более 30 секунд."
