 services:
   tsung1:
     build:
       context: .
     container_name: tsung1
     ports:
       - 8091:8091
     volumes:
       - ./scenarios:/tsung
       - ./log:/root/.tsung/log
     entrypoint: ["tsung", "-f", "/tsung/phase1.xml", "start"]
   
   tsung2:
