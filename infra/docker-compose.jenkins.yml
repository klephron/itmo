services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: devops-jenkins
    ports:
      - "${JENKINS_PORT:?err}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home

  jenkins-agent:
    build:
      context: ./jenkins
      dockerfile: agent.dockerfile
    # WARN: errors with container name can occur with sysbox-runc
    container_name: devops-jenkins-agent
    runtime: sysbox-runc
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY:?err}
    volumes:
      - jenkins-agent-docker:/var/lib/docker

volumes:
  jenkins-home:
    name: "devops-jenkins-home"
    external: true
  jenkins-agent-docker:
    name: "devops-jenkins-agent-docker"
