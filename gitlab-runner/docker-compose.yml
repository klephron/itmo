services:
  runner-1:
    build: .
    container_name: "brainstop-runner-1"
    restart: always
    runtime: sysbox-runc
    volumes:
      - runner-1-etc:/etc/gitlab-runner
      - runner-1-home:/home/gitlab-runner
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2000M"

volumes:
  runner-1-etc:
  runner-1-home:
