services:
  runner-1:
    image: gitlab/gitlab-runner:alpine-v14.1.0
    container_name: "brainstop-runner-1"
    restart: always
    volumes:
      - runner-1-etc:/etc/gitlab-runner
      - runner-1-home:/home/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2000M"

volumes:
  runner-1-etc:
  runner-1-home:
