server:
  port: ${PORT:0}

spring:
  application:
    name: profile-service
  profiles:
    default: dev
  #  cloud:
  #    loadbalancer:
  #      configurations: round_robin
  #      cache:
  #        enabled: true
  #        ttl: 2s

  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database: POSTGRESQL

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.uuid}

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"

storage:
  client:
    base-url: http://storage-service

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
