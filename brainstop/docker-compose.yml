services:
  frontend:
    image: klephronedu/itmo-brainstop-frontend:latest
    container_name: brainstop-frontend
    restart: unless-stopped
    ports:
      - "8098:80"

  discovery:
    image: klephronedu/itmo-brainstop-discovery:latest
    container_name: brainstop-discovery
    restart: unless-stopped
    ports:
      - "8099:8761"
    environment:
      SERVER_PORT: 8761
    depends_on:
      - postgres

  gateway:
    image: klephronedu/itmo-brainstop-gateway:latest
    container_name: brainstop-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8080
      EUREKA_INSTANCE_STATUSPAGEURL: http://gateway:8080/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://gateway:8080/actuator/health
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: jwt_dev_secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: gateway_auth
      SPRING_DATASOURCE_PASSWORD: gateway_auth
    depends_on:
      - discovery

  video:
    image: klephronedu/itmo-brainstop-video:latest
    container_name: brainstop-video
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: video
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8081
      EUREKA_INSTANCE_STATUSPAGEURL: http://video:8081/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://video:8081/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: video_app
      SPRING_DATASOURCE_PASSWORD: video_app
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: jwt_dev_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - discovery
      - minio
      - kafka
      - redis

  profile:
    image: klephronedu/itmo-brainstop-profile:latest
    container_name: brainstop-profile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: profile
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8082
      EUREKA_INSTANCE_STATUSPAGEURL: http://profile:8082/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://profile:8082/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: profile_app
      SPRING_DATASOURCE_PASSWORD: profile_app
      JWT_SECRET: jwt_dev_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - discovery
      - redis

  storage:
    image: klephronedu/itmo-brainstop-storage:latest
    container_name: brainstop-storage
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: storage
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8083
      EUREKA_INSTANCE_STATUSPAGEURL: http://storage:8083/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://storage:8083/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: storage_app
      SPRING_DATASOURCE_PASSWORD: storage_app
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery
      - minio

  interactions:
    image: klephronedu/itmo-brainstop-interactions:latest
    container_name: brainstop-interactions
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: interactions
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8084
      EUREKA_INSTANCE_STATUSPAGEURL: http://interactions:8084/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://interactions:8084/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: interactions_app
      SPRING_DATASOURCE_PASSWORD: interactions_app
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: jwt_dev_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - discovery
      - kafka
      - redis

  admin:
    image: klephronedu/itmo-brainstop-admin:latest
    container_name: brainstop-admin
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: admin
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8085
      EUREKA_INSTANCE_STATUSPAGEURL: http://admin:8085/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://admin:8085/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: admin_app
      SPRING_DATASOURCE_PASSWORD: admin_app
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  search:
    image: klephronedu/itmo-brainstop-search:latest
    container_name: brainstop-search
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: search
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8086
      EUREKA_INSTANCE_STATUSPAGEURL: http://search:8086/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://search:8086/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: search_app
      SPRING_DATASOURCE_PASSWORD: search_app
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  transcoding:
    image: klephronedu/itmo-brainstop-transcoding:latest
    container_name: brainstop-transcoding
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: transcoding
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_NONSECUREPORT: 8088
      EUREKA_INSTANCE_STATUSPAGEURL: http://transcoding:8088/actuator/info
      EUREKA_INSTANCE_HEALTHCHECKURL: http://transcoding:8088/actuator/health
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: transcoding_app
      SPRING_DATASOURCE_PASSWORD: transcoding_app
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery
      - minio
      - kafka

  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainstop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: video-streaming
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/entrypoint/:/docker-entrypoint-initdb.d/:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: brainstop-minio
    restart: unless-stopped
    command: server --console-address ":8091" /data
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin
    ports:
      - "8091:8091"
    volumes:
      - minio-data:/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: brainstop-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    container_name: brainstop-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: brainstop-prometheus
    restart: unless-stopped
    ports:
      - "8090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: brainstop-cadvisor
    ports:
      - 8092:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:latest
    container_name: brainstop-grafana
    ports:
      - "8093:3000"
    volumes:
      - "./grafana/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml"
      - "./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml"
      - "./grafana/dashboards/:/var/lib/grafana/dashboards/"
      - "grafana-data:/var/lib/grafana"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  minio-data:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:
