server:
  port: 8080

spring:
  application:
    name: ticktok-gateway
  profiles:
    default: dev
  cloud:
    loadbalancer:
      retry:
        enabled: true
    gateway:
      routes:
        - id: core
          uri: lb://core-service
          predicates:
            - Path=/api/videos/**,/api/comments/**,/api/admin/**,/api/moderation/**,/api/streaming/**,/api/search/**
        - id: profile
          uri: lb://profile-service
          predicates:
            - Path=/api/users/**
        - id: openapi-core
          uri: lb://core-service
          predicates:
            - Path=/v3/api-docs/core
          filters:
            - RewritePath=/v3/api-docs/core, /v3/api-docs
        - id: openapi-profile
          uri: lb://profile-service
          predicates:
            - Path=/v3/api-docs/profile
          filters:
            - RewritePath=/v3/api-docs/profile, /v3/api-docs
        - id: openapi-storage
          uri: lb://storage-service
          predicates:
            - Path=/v3/api-docs/storage
          filters:
            - RewritePath=/v3/api-docs/storage, /v3/api-docs
  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database: POSTGRESQL

logging:
  level:
    org.springframework.security: INFO

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: core-service
        url: /v3/api-docs/core
      - name: profile-service
        url: /v3/api-docs/profile
      - name: storage-service
        url: /v3/api-docs/storage
    urls-primary-name: gateway
    display-request-duration: true

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
    expiration-ms: 3600000
