server:
  port: 8080

spring:
  application:
    name: brainstop-gateway
  profiles:
    default: dev
  cloud:
    loadbalancer:
      retry:
        enabled: true
    gateway:
      routes:
        - id: interactions
          uri: lb://interactions-service
          predicates:
            - Path=/api/videos/*/comments/**,/api/videos/*/like,/api/videos/*/view
        - id: video
          uri: lb://video-service
          predicates:
            - Path=/api/videos/**,/api/streaming/**
        - id: profile
          uri: lb://profile-service
          predicates:
            - Path=/api/users/**
        - id: admin
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**,/api/moderation/**
        - id: search
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
        - id: openapi-video
          uri: lb://video-service
          predicates:
            - Path=/v3/api-docs/video
          filters:
            - RewritePath=/v3/api-docs/video, /v3/api-docs
        - id: openapi-profile
          uri: lb://profile-service
          predicates:
            - Path=/v3/api-docs/profile
          filters:
            - RewritePath=/v3/api-docs/profile, /v3/api-docs
        - id: openapi-storage
          uri: lb://storage-service
          predicates:
            - Path=/v3/api-docs/storage
          filters:
            - RewritePath=/v3/api-docs/storage, /v3/api-docs
        - id: openapi-admin
          uri: lb://admin-service
          predicates:
            - Path=/v3/api-docs/admin
          filters:
            - RewritePath=/v3/api-docs/admin, /v3/api-docs
        - id: openapi-search
          uri: lb://search-service
          predicates:
            - Path=/v3/api-docs/search
          filters:
            - RewritePath=/v3/api-docs/search, /v3/api-docs
  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database: POSTGRESQL

logging:
  level:
    org.springframework.security: INFO

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: video-service
        url: /v3/api-docs/video
      - name: profile-service
        url: /v3/api-docs/profile
      - name: storage-service
        url: /v3/api-docs/storage
      - name: admin-service
        url: /v3/api-docs/admin
      - name: search-service
        url: /v3/api-docs/search
      - name: interactions-service
        url: /v3/api-docs/interactions
    urls-primary-name: gateway
    display-request-duration: true

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
    expiration-ms: 3600000
