server:
  port: 8080

spring:
  application:
    name: ticktok-gateway
  cloud:
    loadbalancer:
      retry:
        enabled: true
    gateway:
      routes:
        - id: core
          uri: lb://core-service
          predicates:
            - Path=/api/videos/**,/api/comments/**,/api/admin/**,/api/moderation/**,/streaming/**,/admin/**,/moderation/**,/api/search/**
        - id: profile
          uri: lb://profile-service
          predicates:
            - Path=/api/users/**
  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database: POSTGRESQL

logging:
  level:
    org.springframework.security: INFO

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
    expiration-ms: 3600000
