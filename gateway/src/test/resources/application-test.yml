spring:
  application:
    name: gateway-test
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: "test-secret-key-for-unit-tests-must-be-long-enough-to-pass-validation"
    expiration-ms: 3600000
