########## COVERAGE REPORT ##########
coverage-report:
  extends: .gradle-base
  stage: test-coverage
  tags: [brainstop-docker]
  needs:
    - unit-test-admin
    - unit-test-discovery
    - unit-test-gateway
    - unit-test-video
    - unit-test-profile
    - unit-test-storage
    - unit-test-interactions
    - unit-test-search
    - unit-test-transcoding
  script:
    - echo "Generating coverage reports..."
    - ./gradlew jacocoTestReport --no-daemon --continue || true
    - ./gradlew printCoverageReport --no-daemon || true
    - |
      echo ""
      echo "========================================="
      echo "       Coverage Report Summary"
      echo "========================================="
      OVERALL_PASS=1
      TOTAL_COVERED=0
      TOTAL_INSTRUCTIONS=0
      
      for MODULE in admin discovery gateway video profile storage interactions search transcoding; do
        CSV_FILE="${MODULE}/build/reports/jacoco/test/jacocoTestReport.csv"
      
        if [ -f "$CSV_FILE" ]; then
          # ИСПРАВЛЕНИЕ: Суммируем ВСЕ строки (кроме заголовка)
          COVERAGE_DATA=$(awk -F',' '
            NR > 1 { 
              missed += $4; 
              covered += $5; 
            } 
            END { 
              total = missed + covered;
              if (total > 0) {
                coverage = (covered / total) * 100;
                printf "%d,%d,%.2f", covered, total, coverage
              } else {
                print "0,0,0.00"
              }
            }
          ' "$CSV_FILE")
      
          COVERED=$(echo "$COVERAGE_DATA" | cut -d',' -f1)
          TOTAL=$(echo "$COVERAGE_DATA" | cut -d',' -f2)
          COVERAGE=$(echo "$COVERAGE_DATA" | cut -d',' -f3)
          COVERAGE_INT=$(echo "$COVERAGE" | awk '{printf "%.0f", $1}')
      
          if [ "$TOTAL" -gt 0 ]; then
            if [ "$COVERAGE_INT" -ge 60 ]; then
              STATUS="✓ PASS"
            else
              STATUS="✗ FAIL"
              OVERALL_PASS=0
            fi
      
            printf "%-20s %6s%% %s\n" "$MODULE" "$COVERAGE_INT" "$STATUS"
      
            TOTAL_COVERED=$((TOTAL_COVERED + COVERED))
            TOTAL_INSTRUCTIONS=$((TOTAL_INSTRUCTIONS + TOTAL))
          else
            printf "%-20s %6s %s\n" "$MODULE" "N/A" "⚠ NO CODE"
          fi
        else
          printf "%-20s %6s %s\n" "$MODULE" "N/A" "⚠ NO REPORT"
        fi
      done
      
      echo "-----------------------------------------"
      
      if [ $TOTAL_INSTRUCTIONS -gt 0 ]; then
        TOTAL_PERCENT=$(awk "BEGIN {printf \"%.0f\", ($TOTAL_COVERED * 100.0 / $TOTAL_INSTRUCTIONS)}")
      
        if [ "$TOTAL_PERCENT" -ge 60 ]; then
          TOTAL_STATUS="✓ PASS"
        else
          TOTAL_STATUS="✗ FAIL"
          OVERALL_PASS=0
        fi
      
        printf "%-20s %6s%% %s\n" "TOTAL" "$TOTAL_PERCENT" "$TOTAL_STATUS"
      else
        echo "No coverage data available"
        OVERALL_PASS=0
      fi
      
      echo "========================================="
      echo ""
      
      if [ $OVERALL_PASS -eq 0 ]; then
        echo "❌ Some services failed coverage threshold (>= 60%)"
        exit 1
      else
        echo "✅ All services passed coverage threshold"
      fi

  artifacts:
    when: always
    paths:
      - "**/build/reports/jacoco/"
      - "**/build/test-results/"
      - build/reports/jacoco/aggregate/
    expire_in: 30 days
  coverage: '/TOTAL\s+(\d+)%/'
