stages:
  - test-unit
  - test-integration
  - build-and-push

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

.gradle-base:
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x gradlew
    - export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

.unit-test-template:
  extends: .gradle-base
  stage: test-unit
  tags: [brainstop-docker]
  script:
    - echo "[$MODULE] Unit tests passed"

.integration-test-template:
  extends: .gradle-base
  stage: test-integration
  tags: [brainstop-docker]
  needs:
    - unit-test-discovery
    - unit-test-gateway
    - unit-test-video
    - unit-test-profile
    - unit-test-storage
    - unit-test-interactions
    - unit-test-admin
    - unit-test-search
    - unit-test-transcoding
  script:
    - echo "[$MODULE] Integration tests passed"

.docker-build-template:
  stage: build-and-push
  tags: [brainstop-docker]
  image: docker:29
  needs:
    - integration-test-discovery
    - integration-test-gateway
    - integration-test-video
    - integration-test-profile
    - integration-test-storage
    - integration-test-interactions
    - integration-test-admin
    - integration-test-search
    - integration-test-transcoding
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build --build-arg MODULE=$MODULE -t $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG .
    - docker tag $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG $DOCKER_IMAGE_PREFIX$MODULE:latest
    - docker push $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG
    - docker push $DOCKER_IMAGE_PREFIX$MODULE:latest

########## DISCOVERY ##########
unit-test-discovery:
  extends: .unit-test-template
  variables:
    MODULE: discovery

integration-test-discovery:
