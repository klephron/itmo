stages:
  - test-unit
  - test-integration
  - build-and-push
  - test-coverage

variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

.gradle-base:
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x gradlew
    - export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

.unit-test-template:
  extends: .gradle-base
  stage: test-unit
  tags: [brainstop-docker]
  script:
    - echo "[$MODULE] Running unit tests..."
    - ./gradlew :$MODULE:test --no-daemon --continue || TEST_FAILED=1

    - echo "[$MODULE] Generating coverage report..."
    - ./gradlew :$MODULE:jacocoTestReport --no-daemon || true

    - echo "[$MODULE] Checking coverage..."
    - |
      if [ -f "$MODULE/build/reports/jacoco/test/jacocoTestReport.csv" ]; then
        echo "=== JaCoCo CSV found ==="
      
        # Debug: показать первые 5 строк
        echo "CSV preview (first 5 lines):"
        head -n 5 "$MODULE/build/reports/jacoco/test/jacocoTestReport.csv"
        echo ""
      
        # ИСПРАВЛЕНИЕ: Суммируем ВСЕ строки, кроме заголовка
        # Колонка 4 = INSTRUCTION_MISSED, Колонка 5 = INSTRUCTION_COVERED
        COVERAGE=$(awk -F',' '
          NR > 1 { 
            missed += $4; 
            covered += $5; 
          } 
          END { 
            total = missed + covered;
            if (total > 0) {
              printf "%.2f", (covered / total) * 100
            } else {
              print "0.00"
            }
          }
        ' "$MODULE/build/reports/jacoco/test/jacocoTestReport.csv")
      
        echo "[$MODULE] Coverage: ${COVERAGE}%"
      
        # Проверка порога (60%)
        THRESHOLD=60
        COVERAGE_INT=$(echo "$COVERAGE" | awk '{printf "%.0f", $1}')
      
        if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
          echo "[$MODULE] ✗ Coverage below threshold (${COVERAGE}% < ${THRESHOLD}%)"
          TEST_FAILED=1
        else
          echo "[$MODULE] ✓ Coverage OK (${COVERAGE}% >= ${THRESHOLD}%)"
        fi
      else
        echo "[$MODULE] ✗ FAIL: JaCoCo CSV report not found"
        echo "Checking directory structure:"
        ls -lah "$MODULE/build/reports/jacoco/" 2>/dev/null || echo "  -> No jacoco reports dir"
        ls -lah "$MODULE/build/jacoco/" 2>/dev/null || echo "  -> No jacoco exec dir"
        TEST_FAILED=1
      fi

    - |
      if [ -n "$TEST_FAILED" ]; then
        echo "[$MODULE] Tests or coverage check failed"
        exit 1
      fi

  artifacts:
    when: always
    reports:
      junit: $MODULE/build/test-results/test/TEST-*.xml
    paths:
      - $MODULE/build/reports/tests/test/
      - $MODULE/build/reports/jacoco/
      - $MODULE/build/jacoco/
    expire_in: 1 week

.integration-test-template:
  extends: .gradle-base
  stage: test-integration
  tags: [brainstop-docker]
  script:
    - echo "[$MODULE] Integration tests passed"

.docker-build-template:
  stage: build-and-push
  tags: [brainstop-docker]
  image: docker:29
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build --build-arg MODULE=$MODULE -t $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG .
    - docker tag $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG $DOCKER_IMAGE_PREFIX$MODULE:latest
    - docker push $DOCKER_IMAGE_PREFIX$MODULE:$IMAGE_TAG
    - docker push $DOCKER_IMAGE_PREFIX$MODULE:latest

