server:
  port: ${PORT:0}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1
    connection-timeout: 300s

spring:
  application:
    name: video-service
  profiles:
    default: dev
#  cloud:
#    loadbalancer:
#      configurations: round_robin
#      cache:
#        enabled: true
#        ttl: 2s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000

  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 10000MB
      resolve-lazily: true

  mvc:
    async:
      request-timeout: 300s

  datasource:
    url: jdbc:postgresql://localhost:5432/video-streaming
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # ??? ? ??????
    show-sql: false
    database: POSTGRESQL

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

streaming:
  chunk:
    default-size: 2621440  # 2.5 MB

storage:
  client:
    base-url: http://storage-service

transcoder:
  ffmpeg-path: "C:/ffmpeg/bin/ffmpeg.exe"
  ffprobe-path: "C:/ffmpeg/bin/ffprobe.exe"

app:
  jwt:
    secret: "super-secret-key-change-me-to-long-random-string"
    expiration-ms: 3600000
  likes:
    exchange: video.likes
  views:
    exchange: video.views

logging:
  level:
    org.springframework.security: INFO
    io.github.resilience4j.circuitbreaker: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    registry-fetch-interval-seconds: 3
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 9
    instance-id: ${spring.application.name}:${random.uuid}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      default:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true
    instances:
      default:
        baseConfig: default
