version: '3.8'

services:
  postgres:
    container_name: "video-streaming-postgres"
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: video-streaming
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"

  minio:
    container_name: "video-streaming-minio"
    image: quay.io/minio/minio:RELEASE.2024-04-06T05-26-02Z
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: tikttok-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP — backend работает через этот порт
      - "15672:15672"   # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq


volumes:
  rabbitmq-data:
  minio-data:
    driver: local
