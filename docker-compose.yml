services:
  front:
    build: ./front
    depends_on:
      - server
    ports:
      - "${FR_PORT:-8081}:80"
  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-me_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-me}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-me}
    ports:
      - "${SV_PORT:-8080}:8080"

  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-me}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-me}
      POSTGRES_DB: ${DB_NAME:-me_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-me} -d ${DB_NAME:-me_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
