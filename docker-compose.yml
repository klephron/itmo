version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainstop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: video-streaming
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-extensions.sql:/docker-entrypoint-initdb.d/00-init-extensions.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: brainstop-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: brainstop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: discovery
    container_name: brainstop-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    depends_on:
      - postgres

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    container_name: brainstop-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - discovery

  video:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: video
    container_name: brainstop-video
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery
      - minio
      - rabbitmq

  profile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: profile
    container_name: brainstop-profile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  storage:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: storage
    container_name: brainstop-storage
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery
      - minio

  interactions:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: interactions
    container_name: brainstop-interactions
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: admin
    container_name: brainstop-admin
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: search
    container_name: brainstop-search
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery

  transcoding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: transcoding
    container_name: brainstop-transcoding
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URI: http://discovery:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/video-streaming
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_SECRET: jwt_dev_secret
    depends_on:
      - postgres
      - discovery
      - minio
      - rabbitmq

volumes:
  pgdata:
  rabbitmq-data:
  minio-data:
