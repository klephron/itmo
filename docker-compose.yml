services:
  front:
    build: ./front
    depends_on:
      - server
    ports:
      - "${FRONT_PORT:-8081}:80"
  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-me_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-me}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-me}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  postgres:
    image: postgres:17.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-me}
      POSTGRES_DB: ${POSTGRES_DB:-me_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-me} -d ${POSTGRES_DB:-me_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports:
      - "${JENKINS_PORT:-8082}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home

  jenkins-agent:
    image: jenkins/ssh-agent:jdk21
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY}

volumes:
  postgres_data:
  jenkins_home:
