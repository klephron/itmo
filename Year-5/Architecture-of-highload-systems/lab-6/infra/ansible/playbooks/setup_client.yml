---
- hosts: client
  pre_tasks:
    - name: Fail if not Ubuntu
      ansible.builtin.fail:
        msg: "This playbook only supports Ubuntu."
      when: ansible_distribution not in ["Ubuntu"]

- hosts: client
  roles:
    - docker

- hosts: client
  tasks:
    - import_role:
        name: docker
        tasks_from: sysbox.yml
