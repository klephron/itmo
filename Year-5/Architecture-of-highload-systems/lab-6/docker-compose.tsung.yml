 services:
   tsung1:
     build:
       context: ./tsung
       dockerfile: dockerfile
     ports:
       - 8091:8091
     volumes:
       - ./workflow/tsung:/tsung
       - ./log:/root/.tsung/log
     entrypoint: ["tsung", "-f", "/tsung/phase1.xml", "start"]

   tsung2:
