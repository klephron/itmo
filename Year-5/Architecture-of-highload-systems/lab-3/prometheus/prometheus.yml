global:
  scrape_interval: 15s
  external_labels:
    monitor: 'emqx-monitor'

rule_files:
  - 'rules.yml'

scrape_configs:
  - job_name: 'emqx_stats'
    static_configs:
      - targets: ['mqtt-broker:18083']
    metrics_path: '/api/v5/prometheus/stats'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  - job_name: 'emqx_auth'
    static_configs:
      - targets: [ 'mqtt-broker:18083' ]
    metrics_path: '/api/v5/prometheus/auth'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  - job_name: 'emqx_data_integration'
    static_configs:
      - targets: [ 'mqtt-broker:18083' ]
    metrics_path: '/api/v5/prometheus/data_integration'
    scheme: 'http'
    basic_auth:
      username: ''
      password: ''

  - job_name: 'mongodb'
    metrics_path: /metrics
    scheme: http
    static_configs:
    - targets: ['mongodb-exporter:9216']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'rule-engine'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['rule-engine']
    relabel_configs:
      - source_labels: []
        target_label: __metrics_path__
        replacement: /metrics

  - job_name: 'iot-controller'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['iot-controller']
    relabel_configs:
      - source_labels: []
        target_label: __metrics_path__
        replacement: /metrics

  - job_name: 'account-service'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['account-service']
    relabel_configs:
      - source_labels: []
        target_label: __metrics_path__
        replacement: /actuator/prometheus
