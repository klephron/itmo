global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dummy
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - /etc/prometheus/jobs.yml

  - job_name: mops-rabbitmq
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - mops-rabbitmq:15692

  - job_name: mops-mongo-exporter
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - mops-mongo-exporter:9216
