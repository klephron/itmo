---
- name: Add default disable ipv6 = 1
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.disable_ipv6
    value: '1'
    sysctl_set: true
    state: present
  tags: ipv6
  become: true

- name: Add lo disable ipv6 = 1
  ansible.posix.sysctl:
    name: net.ipv6.conf.lo.disable_ipv6
    value: '1'
    sysctl_set: true
    state: present
  tags: ipv6
  become: true

- name: Add all disable ipv6 = 1 and reload
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  tags: ipv6
  become: true
