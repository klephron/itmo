components:
  schemas:
    LocationUpdateRequest:
      required:
      - altitude
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: number
          format: double
    NotificationsController.Status:
      type: string
      enum:
      - READ
      - UNREAD
      - ALL
    RegisterRequest:
      required:
      - name
      - password
      - patronymic
      - surname
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        surname:
          type: string
        patronymic:
          type: string
    UserDto:
      required:
      - id
      - locationAltitude
      - locationLatitude
      - locationLongitude
      - username
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          minLength: 1
          type: string
        locationLatitude:
          type: number
          format: double
        locationLongitude:
          type: number
          format: double
        locationAltitude:
          type: number
          format: double
    UserInfoResponse:
      required:
      - id
      - username
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    UserPermissionsRequest:
      required:
      - permissions
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    UserPermissionsResponse:
      required:
      - permissions
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
    UsernamePasswordCredentials:
      required:
      - password
      - username
      type: object
      properties:
        username:
          minLength: 1
          type: string
          nullable: true
        password:
          minLength: 1
          type: string
          nullable: true
        identity:
          type: string
          nullable: true
        secret:
          type: string
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
